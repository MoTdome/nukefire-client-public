name: Build Mac and Windows Distributions

on:
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify locked source
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source and tests
        run: npm run verify

  prepare-release:
    name: Prepare draft prerelease
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create draft GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="NukeFire Client ${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; reusing it."
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$title" \
              --prerelease \
              --draft \
              --generate-notes
          fi

  macos:
    name: Build macOS Universal
    needs:
      - verify
      - prepare-release
    runs-on: macos-14
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Build unsigned macOS packages
        run: npm run dist:mac

      - name: Create macOS checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS-macOS.txt

      - name: Upload macOS packages directly to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            dist/*.dmg dist/*.zip dist/SHA256SUMS-macOS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  windows:
    name: Build Windows x64
    needs:
      - verify
      - prepare-release
    runs-on: windows-2025
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Build unsigned Windows packages
        run: npm run dist:win

      - name: Create Windows checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist -Filter *.exe | Sort-Object Name
          if (-not $files) { throw "No Windows executables were built." }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii dist/SHA256SUMS-Windows.txt

      - name: Upload Windows packages directly to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @(
            Get-ChildItem -Path dist -Filter *.exe | ForEach-Object { $_.FullName }
            (Resolve-Path dist/SHA256SUMS-Windows.txt).Path
          )
          if ($assets.Count -lt 2) { throw "Expected Windows packages and checksum file." }
          & gh release upload $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish-release:
    name: Publish completed prerelease
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - macos
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish the completed GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease \
            --latest=false
